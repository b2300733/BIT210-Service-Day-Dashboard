<header class="sticky top-0 z-50 border-b border-gray-300 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:px-8">
    <div class="flex items-center gap-3">
      <div class="text-primary flex items-center gap-2">
        <lucide-icon [img]="Heart" class="h-5 w-5"></lucide-icon>
        <span class="text-lg font-bold tracking-tight">Service Day</span>
      </div>
    </div>

    <div class="flex items-center gap-2 text-sm">
      <button
        type="button"
        class="hover:bg-green relative inline-flex h-9 cursor-pointer items-center justify-center rounded-md px-3 hover:text-white"
      >
        <lucide-icon [img]="Bell" class="h-4 w-4"></lucide-icon>
        <span
          class="bg-red absolute -top-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full text-[10px] leading-0 text-white"
          >1</span
        >
      </button>
      <div class="hidden text-right sm:block">
        <p class="text-foreground">John Doe</p>
        <p class="text-xs text-gray-500">Engineering</p>
      </div>

      <button
        type="button"
        class="hover:bg-green inline-flex h-9 cursor-pointer items-center justify-center gap-2 rounded-md px-3 hover:text-white"
      >
        <lucide-icon [img]="LogOut" class="h-4 w-4"></lucide-icon>
        <span class="hidden sm:inline">Sign Out</span>
      </button>
    </div>
  </div>
</header>
