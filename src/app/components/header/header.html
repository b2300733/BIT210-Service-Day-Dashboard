<header class="sticky top-0 z-50 border-b border-gray-300 backdrop-blur bg-white/90">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:px-8">
    
    <div class="flex items-center gap-3">
      <div class="text-[#205b9b] flex items-center gap-2">
        <lucide-icon [img]="Heart" class="h-5 w-5"></lucide-icon>
        <span class="text-lg font-extrabold tracking-tight">Service Day</span>
      </div>
      <span class="rounded-full bg-orange-200 px-2.5 py-0.5 text-xs font-semibold">Admin</span>
    </div>

    <div class="flex items-center gap-2 text-sm">
      
      <div class="relative">
        
        <button
          type="button"
          (click)="isDropdownOpen = !isDropdownOpen" 
          class="hover:bg-gray-100 relative inline-flex h-9 cursor-pointer items-center justify-center rounded-md px-3 text-gray-600 transition-colors"
        >
          <lucide-icon [img]="Bell" class="h-4 w-4"></lucide-icon>
          <span *ngIf="unreadCount > 0"
            class="bg-red-600 absolute -top-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full text-[10px] leading-none text-white"
            >{{ unreadCount }}</span
          >
        </button>

        <div *ngIf="isDropdownOpen" 
             (click)="isDropdownOpen = false" 
             class="fixed inset-0 z-40 cursor-default">
        </div>

        <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2 w-80 rounded-lg border border-gray-200 bg-white shadow-xl flex flex-col z-50 overflow-hidden">
          
          <div class="flex items-center justify-between border-b border-gray-100 p-4 bg-gray-50/50">
            <span class="font-semibold text-gray-900">Notifications</span>
            <button 
              (click)="markAllRead()"
              [disabled]="unreadCount === 0"
              class="text-xs font-medium text-[#205b9b] hover:text-blue-800 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-1 transition-colors">
              <lucide-icon [img]="CheckCheck" class="h-3 w-3"></lucide-icon>
              Mark all read
            </button>
          </div>
          
          <div class="max-h-[320px] overflow-y-auto p-2 flex flex-col gap-1 relative z-50">
            <div *ngIf="notifications.length === 0" class="p-4 text-center text-sm text-gray-500">
              No notifications available.
            </div>
            
            <button *ngFor="let notification of notifications"
                    type="button"
                    class="flex items-start gap-3 rounded-md p-3 text-left transition-colors hover:bg-gray-100 w-full"
                    [ngClass]="!notification.isRead ? 'bg-[#f0f6fc]' : 'bg-transparent'">
              
              <div class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full"
                   [ngClass]="notification.type === 'success' ? 'bg-[#eaf6f0] text-[#309267]' : 'bg-[#d9e8f9] text-[#205b9b]'">
                <lucide-icon *ngIf="notification.type === 'success'" [img]="Check" class="h-3 w-3"></lucide-icon>
                <lucide-icon *ngIf="notification.type === 'reminder'" [img]="Bell" class="h-3 w-3"></lucide-icon>
                <lucide-icon *ngIf="notification.type === 'update'" [img]="Megaphone" class="h-3 w-3"></lucide-icon>
              </div>

              <div class="flex-1 overflow-hidden">
                <div class="flex items-center justify-between gap-2">
                  <p class="text-sm truncate text-gray-900" [ngClass]="notification.isRead ? 'font-normal' : 'font-semibold'">
                    {{ notification.title }}
                  </p>
                  <span *ngIf="!notification.isRead" class="h-1.5 w-1.5 shrink-0 rounded-full bg-[#205b9b]"></span>
                </div>
                <p class="mt-0.5 text-xs text-gray-500 line-clamp-2 leading-relaxed">
                  {{ notification.message }}
                </p>
                <p class="mt-1.5 text-[10px] text-gray-400 font-medium">
                  {{ notification.timestamp }}
                </p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="hidden text-right sm:block z-10">
        <p class="text-gray-900 font-medium">John Doe</p>
        <p class="text-xs text-gray-500">Engineering</p>
      </div>

      <button
        type="button"
        class="hover:bg-gray-100 text-gray-600 inline-flex h-9 cursor-pointer items-center justify-center gap-2 rounded-md px-3 transition-colors z-10"
        routerLink="/login"
      >
        <lucide-icon [img]="LogOut" class="h-4 w-4"></lucide-icon>
        <span class="hidden sm:inline">Sign Out</span>
      </button>
    </div>
  </div>
</header>
