<div class="rounded-lg border border-gray-200 bg-white shadow-sm">
  
  <div class="flex flex-row items-center justify-between p-6">
    <div class="flex items-center gap-2 text-base font-semibold tracking-tight text-gray-900">
      <lucide-icon [img]="Bell" class="h-5 w-5"></lucide-icon>
      Notifications
      <div *ngIf="unreadCount > 0" class="inline-flex items-center rounded-full bg-red-600 px-2.5 py-0.5 text-xs font-semibold text-white transition-colors">
        {{ unreadCount }} new
      </div>
    </div>
    
    <button 
      (click)="markAllRead()"
      [disabled]="unreadCount === 0"
      class="inline-flex h-9 items-center justify-center gap-2 rounded-md border border-gray-300 bg-transparent px-3 text-sm font-medium transition-colors hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400">
      <lucide-icon [img]="CheckCheck" class="h-4 w-4"></lucide-icon>
      Mark All Read
    </button>
  </div>

  <div class="flex flex-col gap-3 p-6 pt-0">
    <button *ngFor="let notification of notifications"
            type="button" 
            class="flex items-start gap-4 rounded-lg border p-4 text-left transition-colors w-full"
            [ngClass]="notification.isRead ? 'border-gray-200 bg-white hover:bg-gray-50' : 'border-[#b5d3f8] bg-[#f0f6fc] hover:bg-[#e4effa]'">
      
      <div class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
           [ngClass]="{
             'bg-[#eaf6f0] text-[#309267]': notification.type === 'success',
             'bg-[#d9e8f9] text-[#205b9b]': notification.type !== 'success'
           }">
        <lucide-icon *ngIf="notification.type === 'success'" [img]="Check" class="h-4 w-4"></lucide-icon>
        <lucide-icon *ngIf="notification.type === 'reminder'" [img]="Bell" class="h-4 w-4"></lucide-icon>
        <lucide-icon *ngIf="notification.type === 'update'" [img]="Megaphone" class="h-4 w-4"></lucide-icon>
      </div>

      <div class="flex-1">
        <div class="flex items-center gap-2">
          <p class="text-sm text-gray-900" [ngClass]="notification.isRead ? 'font-normal' : 'font-semibold'">
            {{ notification.title }}
          </p>
          <span *ngIf="!notification.isRead" class="h-2 w-2 shrink-0 rounded-full bg-[#205b9b]"></span>
        </div>
        <p class="mt-1 text-sm text-gray-500">{{ notification.message }}</p>
        <p class="mt-1.5 text-xs text-gray-400">{{ notification.timestamp }}</p>
      </div>
    </button>
  </div>
</div>
