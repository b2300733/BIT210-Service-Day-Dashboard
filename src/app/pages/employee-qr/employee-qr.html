<div class="flex flex-col gap-6 relative">
  
  <div class="rounded-lg border border-gray-200 bg-white shadow-sm">
    <div class="flex flex-col space-y-1.5 p-6 pb-4">
      <div class="font-semibold tracking-tight flex items-center gap-2 text-base text-gray-900">
        <lucide-icon [img]="Search" class="h-5 w-5"></lucide-icon>
        Search Activities
      </div>
    </div>
    <div class="p-6 pt-0">
      <div class="relative">
        <lucide-icon [img]="Search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400"></lucide-icon>
        <input 
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search by activity name or location..." 
          class="flex h-10 w-full rounded-md border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#205b9b] transition-colors"
        >
      </div>
    </div>
  </div>

  <div class="rounded-lg border border-gray-200 bg-white shadow-sm">
    <div class="flex flex-col space-y-1.5 p-6">
      <div class="font-semibold tracking-tight text-base text-gray-900">My Activities</div>
    </div>
    
    <div class="p-6 pt-0">
      <div class="flex flex-col gap-4">
        
        <div *ngIf="filteredActivities.length === 0" class="text-center py-8 text-gray-500 text-sm border border-dashed border-gray-200 rounded-lg">
          No activities found matching your search.
        </div>

        <div *ngFor="let activity of filteredActivities" 
             class="flex flex-col gap-3 rounded-lg border border-gray-200 p-5 transition-colors bg-white">
          
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <p class="font-medium text-gray-900">{{ activity.title }}</p>

              <div class="mt-1 flex flex-wrap items-center gap-3 text-xs text-gray-500">
                <span class="flex items-center gap-1">
                  <lucide-icon [img]="Calendar" class="h-3 w-3"></lucide-icon>
                  {{ activity.date }}
                </span>
                <span class="flex items-center gap-1">
                  <lucide-icon [img]="Clock" class="h-3 w-3"></lucide-icon>
                  {{ activity.time }}
                </span>
                <span class="flex items-center gap-1">
                  <lucide-icon [img]="MapPin" class="h-3 w-3"></lucide-icon>
                  {{ activity.location }}
                </span>
              </div>
            </div>

            <button 
              (click)="toggleQr(activity)"
              [ngClass]="activity.showQr ? 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300' : 'bg-[#205b9b] text-white hover:bg-blue-800'"
              class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#205b9b] h-9 rounded-md px-3 gap-2 self-start sm:self-center">
              <lucide-icon [img]="QrCode" class="h-4 w-4"></lucide-icon>
              {{ activity.showQr ? 'Hide QR' : 'View QR' }}
            </button>
          </div>

          <div *ngIf="activity.showQr" class="mt-3 pt-4 border-t border-gray-100 flex flex-col items-center justify-center animate-in fade-in slide-in-from-top-2">
            <p class="text-sm text-gray-500 mb-3">Present this code to the event coordinator</p>
            
            <div class="relative group border border-gray-200 p-2 rounded-xl bg-white shadow-sm overflow-hidden">
              <img [src]="'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + activity.qrData" alt="QR Code" class="w-32 h-32 object-contain">
              
              <button 
                (click)="enlargeQr(activity)"
                class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-[1px]">
                <lucide-icon [img]="Maximize" class="h-6 w-6 mb-1"></lucide-icon>
                <span class="text-xs font-medium">Enlarge</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div *ngIf="enlargedQrActivity" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in zoom-in-95 duration-200">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm flex flex-col items-center relative">
      <button (click)="closeEnlargedQr()" class="absolute top-4 right-4 p-1.5 rounded-full hover:bg-gray-100 transition-colors text-gray-500">
        <lucide-icon [img]="X" class="h-5 w-5"></lucide-icon>
      </button>
      
      <h3 class="text-lg font-bold text-gray-900 text-center mb-1 pr-6 pl-6">{{ enlargedQrActivity.title }}</h3>
      <p class="text-sm text-gray-500 mb-6 text-center">Scan to check in</p>
      
      <div class="border-4 border-gray-100 rounded-xl p-4 shadow-inner mb-6 bg-white">
        <img [src]="'https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=jpeg&data=' + enlargedQrActivity.qrData" alt="Enlarged QR Code" class="w-64 h-64 object-contain">
      </div>

      <button 
        (click)="downloadQr(enlargedQrActivity)"
        class="inline-flex w-full items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#205b9b] bg-[#205b9b] text-white hover:bg-blue-800 h-10 px-4 py-2 rounded-md gap-2">
        <lucide-icon [img]="Download" class="h-4 w-4"></lucide-icon>
        Download as JPG
      </button>
    </div>
  </div>

</div>
